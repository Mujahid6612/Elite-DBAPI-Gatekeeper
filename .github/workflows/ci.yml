name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The SQL Server driver is an optional peer dependency and is intentionally
      # not installed: no configured tenant uses dbType=1, and its transitive tree
      # is large. repositories/sqlServerRepository.js fails with a clear message
      # if that path is ever exercised without it.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test
